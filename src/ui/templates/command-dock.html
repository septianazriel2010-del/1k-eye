  <!-- Unified bottom command dock: locations, voice (injected at runtime), visual presets -->
  <div id="command-dock" aria-label="Kontrol navigasi, suara, dan tampilan visual">
  <!-- Control panel -->
  <div id="control-panel" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="panel-inner">
      <button id="control-panel-toggle" class="panel-header dock-tray-toggle" type="button"
        data-dock-toggle-target="control-panel" aria-expanded="false"
        aria-controls="control-panel-popover" aria-label="Buka prasetel visual">
        <span class="panel-title"><span class="dock-label-icon dock-label-icon-presets" aria-hidden="true"></span>PRASETEL VISUAL</span>
        <span class="panel-divider"></span>
      </button>
      <div id="control-panel-popover" class="dock-popover-content">
      <button class="dock-pin-btn" data-pin-target="control-panel" type="button" aria-label="Sematkan prasetel visual" aria-pressed="false" title="Biarkan prasetel visual tetap terbuka"><img src="/pin.svg" alt="" /></button>
      <div id="style-buttons" class="button-grid">
        <button class="style-btn active" data-style="normal" title="Tampilkan globe tanpa filter visual.">
          <span class="btn-icon">◯</span>
          <span class="btn-label">Normal</span>
          <span class="btn-key">1</span>
        </button>
        <button class="style-btn" data-style="retro" title="Tiru layar CRT berpendar hijau dengan garis pindai dan lengkungan layar.">
          <span class="btn-icon">▦</span>
          <span class="btn-label">CRT</span>
          <span class="btn-key">2</span>
        </button>
        <button class="style-btn" data-style="surveillance" title="Simulasikan kacamata penglihatan malam dengan penguatan hijau dan efek tabung.">
          <span class="btn-icon">🌙</span>
          <span class="btn-label">NVG</span>
          <span class="btn-key">3</span>
        </button>
        <button class="style-btn" data-style="thermal" title="Simulasikan kontras termal FLIR. Tingkatkan Ironbow untuk menambahkan warna.">
          <span class="btn-icon">🌡️</span>
          <span class="btn-label">FLIR</span>
          <span class="btn-key">4</span>
        </button>
        <button class="style-btn" data-style="anime" title="Terapkan warna cerah bergaya animasi dan garis ilustrasi.">
          <span class="btn-icon">✦</span>
          <span class="btn-label">Anime</span>
          <span class="btn-key">5</span>
        </button>
        <button class="style-btn" data-style="noir" title="Terapkan nuansa monokrom kontras tinggi bergaya film noir.">
          <span class="btn-icon">◐</span>
          <span class="btn-label">Noir</span>
          <span class="btn-key">6</span>
        </button>
        <button class="style-btn" data-style="snow" title="Tambahkan efek putih bersalju yang dingin pada pemandangan.">
          <span class="btn-icon">❄</span>
          <span class="btn-label">Salju</span>
          <span class="btn-key">7</span>
        </button>
      </div>
      <section class="map-source-section" aria-labelledby="map-source-label">
        <div class="map-source-heading">
          <span id="map-source-label">SUMBER PETA</span>
          <span id="map-stack-status" class="pp-stack-status" aria-live="polite">3D</span>
        </div>
        <div id="map-stack-chips" class="map-stack-chip-row" role="group" aria-label="Sumber peta"></div>
      </section>
      </div>
      <div id="style-mini-status" class="panel-mini-status" aria-live="polite">
        <span class="panel-mini-label">Tampilan</span>
        <span id="style-mini-value" class="panel-mini-value">NORMAL</span>
      </div>
    </div>
  </div>

  <!-- Location bar -->
  <div id="location-bar" class="panel-collapsible collapsed">
    <div class="panel-glow"></div>
    <div class="location-inner">
      <div class="location-toolbar">
        <button id="location-bar-toggle" class="dock-tray-toggle" type="button" data-dock-toggle-target="location-bar" aria-controls="location-bar-popover" aria-expanded="false" aria-label="Buka lokasi" title="Buka lokasi">
          <span class="location-toolbar-label"><span class="dock-label-icon dock-label-icon-location" aria-hidden="true"></span>LOKASI</span>
        </button>
        <button class="panel-collapse-btn" data-collapse-target="location-bar" title="Ciutkan panel">+</button>
      </div>
      <div id="location-mini-status" class="location-mini-status" aria-live="polite">
        <div id="location-mini-city" class="location-mini-city">📍 Lokasi: --</div>
        <div id="location-mini-poi" class="location-mini-poi">Tengara: --</div>
      </div>
      <div id="location-bar-popover" class="dock-popover-content">
        <button class="dock-pin-btn" data-pin-target="location-bar" type="button" aria-label="Sematkan panel lokasi" aria-pressed="false" title="Biarkan panel lokasi tetap terbuka"><img src="/pin.svg" alt="" /></button>
        <div id="poi-row" class="poi-row-container"></div>
        <div class="location-bar-divider" id="location-bar-divider"></div>
        <div class="location-city-row">
          <div id="location-pills" class="location-pills"></div>
          <div class="location-search-wrap">
            <button id="search-toggle" class="search-toggle-btn" title="Cari lokasi">
              <span>&#x1F50E;</span>
            </button>
            <input type="text" id="location-search" placeholder="Cari lokasi..." autocomplete="off" spellcheck="false" aria-label="Cari lokasi berdasarkan nama atau koordinat" />
          </div>
        </div>
      </div>
    </div>
  </div>
  </div>
